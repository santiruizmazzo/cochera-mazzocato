name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, test, dev ]
    paths:
      - frontend/**
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Run ESLint
        run: |
          bun run lint

      - name: Run Prettier check
        run: |
          bun run format:check

  test-deploy:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/test'
    
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TEST_NETLIFY_PROJECT: test-cochera-mazzocato

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run gen-env

      - name: Install Netlify CLI
        run: bun add -g netlify-cli

      - name: Check existing Netlify projects
        run: netlify sites:list --auth $NETLIFY_AUTH_TOKEN

      - name: Deploy to Test Environment
        run: netlify deploy --dir=public --prod --site=$TEST_NETLIFY_PROJECT --auth $NETLIFY_AUTH_TOKEN

