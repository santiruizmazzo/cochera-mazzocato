name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, test, dev ]
    paths:
      - frontend/**
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Run ESLint
        run: |
          bun run lint

      - name: Run Prettier check
        run: |
          bun run format:check
      
      - name: Build app
        run: |
          bun run build
      
      - name: Verify build output
        run: |
          ls -la build/
          echo "Build folder contents:"
          find build/ -type f | head -10

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: frontend/build/
          if-no-files-found: error
          retention-days: 1

  test-deploy:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/test'
    
    env:
      PUBLIC_API_URL: ${{ secrets.TEST_API_URL }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TEST_NETLIFY_PROJECT_ID: ${{ secrets.TEST_NETLIFY_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: frontend/build/
      
      - name: Verify downloaded artifacts
        run: |
          ls -la build/
          echo "Downloaded build folder contents:"
          find build/ -type f | head -10

      - name: Install Netlify CLI
        run: bun add -g netlify-cli

      - name: Check existing Netlify projects
        run: netlify sites:list --auth $NETLIFY_AUTH_TOKEN

      - name: Deploy to Test Environment
        run: netlify deploy --dir=build --prod --site=$TEST_NETLIFY_PROJECT_ID --auth=$NETLIFY_AUTH_TOKEN

