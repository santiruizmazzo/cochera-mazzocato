name: Frontend CI Pipeline

on:
  push:
    branches: [ main, dev ]
    paths:
      - frontend/**
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Run ESLint
        run: |
          bun run lint

      - name: Run Prettier check
        run: |
          bun run format:check

      - name: Build app
        run: |
          bun run build
        env:
          VITE_API_URL: ${{ secrets.TEST_API_URL }}

      - name: Verify build output
        run: |
          ls -la build/
          echo "Build folder contents:"
          find build/ -type f | head -10
