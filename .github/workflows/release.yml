name: Release & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.24'

jobs:
  verify:
    name: Verify version & run checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tag matches source of truth
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          BACKEND_VERSION=$(grep -oP 'return "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' backend/application/version.go)
          if [ "$BACKEND_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ backend/application/version.go tiene $BACKEND_VERSION, esperaba $TAG_VERSION"
            exit 1
          fi

          FRONTEND_VERSION=$(jq -r .version frontend/package.json)
          if [ "$FRONTEND_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ frontend/package.json tiene $FRONTEND_VERSION, esperaba $TAG_VERSION"
            exit 1
          fi

          echo "✅ El tag coincide con la versión en backend y frontend"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build API
        working-directory: backend
        run: make build-dev

      - name: Run backend unit tests
        working-directory: backend
        run: make test-unit

  deploy-backend:
    name: Deploy backend to Production
    runs-on: ubuntu-latest
    needs: verify

    env:
      DEPLOY_URL: ${{ secrets.TEST_API_DEPLOY_HOOK }}

    steps:
      - name: Deploy to production server
        run: |
          echo "Deploying backend to production environment..."
          curl "$DEPLOY_URL"
          echo "✅ Backend deployment completed!"

  deploy-frontend:
    name: Deploy frontend to Production
    runs-on: ubuntu-latest
    needs: verify

    defaults:
      run:
        working-directory: frontend

    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TEST_NETLIFY_PROJECT_ID: ${{ secrets.TEST_NETLIFY_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.TEST_API_URL }}

      - name: Install Netlify CLI
        run: bun add -g netlify-cli

      - name: Deploy to Production
        run: netlify deploy --no-build --dir=build --prod --site=$TEST_NETLIFY_PROJECT_ID --auth=$NETLIFY_AUTH_TOKEN
